name: Legacy Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'

permissions:
  contents: read

# Prevent concurrent runs of the same workflow; only pull request runs are
# cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legacy-test:
    name: Legacy integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Docker Compose
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Run tests
      run: make -C legacy test
