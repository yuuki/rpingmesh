name: Legacy Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'

permissions:
  contents: read

# Prevent concurrent runs of the same workflow; only pull request runs are
# cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  legacy-test:
    name: Legacy integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup Docker Compose
      uses: docker/setup-buildx-action@v4.4.1

    - name: Run tests
      run: make -C legacy test
