name: Legacy Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'legacy/**'
      - '.github/workflows/legacy-test.yml'

# Prevent concurrent runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-test:
    name: Legacy integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Compose
      uses: docker/setup-buildx-action@v3

    - name: Run tests
      run: make -C legacy test
