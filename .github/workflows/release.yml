name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # gh release create publishes the release and its assets
    steps:
      # The full history and tags let `git describe` name the version. The
      # release is published with gh and GH_TOKEN, not with git, so the
      # checkout keeps no credentials.
      - name: Checkout release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No build caches in the release job: a cache written by another
      # workflow run must not be able to change the released binaries.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
          use-cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libibverbs-dev librdmacm-dev

      # Pinned plugin versions (see install-protoc-plugins in the Makefile).
      - name: Install protoc Go plugins
        run: |
          make install-protoc-plugins
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf bindings
        run: make generate-proto

      - name: Run static checks
        run: make vet

      - name: Build binaries
        run: make build VERSION="${GITHUB_REF_NAME#v}"

      - name: Run Zig unit tests
        run: make test-zig

      - name: Run Go tests excluding e2e
        run: |
          # shellcheck disable=SC2046 # the package list is split on purpose
          go test $(go list ./... | grep -v '/e2e')

      - name: Run controller e2e tests
        run: make test-e2e-controller

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # AGENT_BUILDER=el9 links the agent inside an Enterprise Linux 9
      # container (Dockerfile.agent-el9) so the released binary runs on
      # glibc >= 2.34 (RHEL 9 family) instead of inheriting this runner's
      # newer glibc; the target fails if the floor is exceeded.
      - name: Build Linux amd64 release assets
        run: make package archive VERSION="${GITHUB_REF_NAME#v}" NFPM_ARCH=amd64 AGENT_BUILDER=el9

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
