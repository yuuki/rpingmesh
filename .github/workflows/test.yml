name: Tests

# Validates the active implementation at the repository root. The archived
# implementation is covered separately by legacy-test.yml.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Weekly: longer fuzzing and a check against new runner images.
  schedule:
    - cron: '13 13 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Prevent concurrent runs of the same workflow on the same ref; only pull
# request runs are cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # golangci-lint (.golangci.yml) and go.mod tidiness. The linters type-check
  # every package, so the generated protobuf code must exist; the Cgo
  # packages only need the committed zig/include/rdma_bridge.h, not
  # librdmabridge.a.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install protoc Go plugins
        run: |
          make install-protoc-plugins
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf bindings
        run: make generate-proto

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

      - name: go mod tidy
        run: go mod tidy -diff

  # Full build (Zig static lib + CGO agent + pure-Go controller) and the
  # Go unit test suite. Excludes ./e2e/..., which requires either live
  # Docker infrastructure (see e2e-controller) or RDMA hardware/soft-RoCE
  # (see e2e-rdma) and is not runnable as a plain `go test`.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway PostgreSQL for the registry's PostgreSQL tests in test-race
    # (they skip without RPINGMESH_TEST_POSTGRES_URI). This is the oldest
    # release the README supports; e2e-controller runs the newest.
    services:
      postgres:
        image: postgres:15.19
        env:
          # Not a secret: the server lives only as long as this job.
          POSTGRES_PASSWORD: rpingmesh-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Install system dependencies (protoc, libibverbs, librdmacm, clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libibverbs-dev librdmacm-dev clang llvm

      - name: Install protoc Go plugins
        run: |
          make install-protoc-plugins
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf bindings
        run: make generate-proto

      # The service-tracing eBPF program must still compile and its committed
      # Go bindings must be current; the committed objects themselves are not
      # compared (they differ between clang versions).
      - name: Check the eBPF program and bindings
        run: make check-bpf

      - name: go vet
        run: make vet

      - name: Build (Zig library + CGO agent + controller)
        run: make build

      - name: Run Zig unit tests
        run: make test-zig

      - name: Run scripts/topology tests
        run: make test-scripts

      - name: Run Go unit tests with the race detector (excludes ./e2e/...)
        env:
          RPINGMESH_TEST_POSTGRES_URI: postgres://postgres:rpingmesh-ci@127.0.0.1:5432/postgres?sslmode=disable
        run: make test-race

      # Load the service-tracing eBPF objects into the runner's kernel and
      # attach uverbs and optional kernel ULP probes, which needs root.
      # Tests skip when their modules/BTF are unavailable on the runner.
      # The RDMA netlink request tests that spoof a user-space sender or
      # force an oversized datagram need CAP_NET_ADMIN (generic netlink
      # only, no RDMA module) and skip in the unprivileged run above.
      - name: Load the eBPF tracer and run netlink tests (root)
        run: |
          sudo modprobe ib_uverbs || echo "::warning::ib_uverbs not available; the tracer load test will skip"
          sudo -E env "PATH=$PATH" go test -count=1 -v -run 'Test(Kernel)?TracerOpenClose|TestRequestRDMARejects(UserSpaceSender|TruncatedDatagram)' ./internal/agent/servicetrace/

  # Every Go fuzz target (make test-fuzz): briefly on pull requests and
  # pushes, longer on the weekly schedule. A crasher is uploaded so it can be
  # committed as a regression seed.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # internal/rdmabridge's fuzz target links librdmabridge.a.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Install system dependencies (protoc, libibverbs, librdmacm)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libibverbs-dev librdmacm-dev

      - name: Install protoc Go plugins
        run: |
          make install-protoc-plugins
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run every fuzz target
        run: make test-fuzz FUZZTIME="$FUZZTIME"

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30

  # actionlint and zizmor on .github/. With GH_TOKEN, zizmor also runs the
  # audits that query the GitHub API (e.g. known-vulnerable actions).
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # actionlint is built with `go run` at the version the Makefile pins.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-actions

  # Release-style portable agent build: links the agent in an Enterprise
  # Linux 9 container and fails if the binary needs a glibc newer than the
  # supported floor (2.34, RHEL 9 family). The binary is uploaded so it can be
  # tried on real hardware before a release is tagged.
  agent-el9:
    name: agent-el9 (portable build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build agent in EL9 container and check glibc floor
        run: make package-build-agent-el9 NFPM_ARCH=amd64

      - name: Upload portable agent binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rpingmesh-agent-el9-linux-amd64
          path: bin/rpingmesh-agent
          retention-days: 14

  # Agent-to-Controller e2e tests: pure-Go gRPC path against real
  # Controllers backed by rqlite and by PostgreSQL, no RDMA hardware needed.
  # Runs entirely via docker compose (see docker-compose.e2e-controller.yml).
  e2e-controller:
    name: e2e-controller
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Run Agent-to-Controller e2e tests
        run: make test-e2e-controller

  # RDMA e2e tests using soft-RoCE (rdma_rxe) inside a privileged container.
  # GitHub-hosted runners are real VMs (so privileged Docker containers do
  # work), but the rdma_rxe module is not always present on the host kernel
  # image. We attempt to install the matching linux-modules-extra-$(uname -r)
  # package and modprobe rdma_rxe on the host below, but this is a confirmed
  # environment-level limitation on the current runner image, not just a
  # missing-package issue: as of 2026-07-04, on kernel 6.17.0-1018-azure the
  # linux-modules-extra-6.17.0-1018-azure package installs successfully, yet
  # it does not contain rdma_rxe.ko at all ("modprobe: FATAL: Module rdma_rxe
  # not found in directory /lib/modules/6.17.0-1018-azure") -- the Ubuntu
  # linux-azure kernel flavor GitHub Actions runners use apparently does not
  # build the soft-RoCE driver, unlike linux-generic. There is no further
  # apt-level fix for this; it would require a different runner
  # image/kernel flavor (e.g. self-hosted or a non-Azure kernel) to resolve.
  # Skip the e2e step when rxe cannot be loaded so the job stays green on
  # those kernels; if rxe did load, a failing test must fail the workflow.
  e2e-rdma:
    name: e2e-rdma (soft-RoCE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Install and load rdma_rxe kernel module
        id: rxe
        run: |
          echo "Installing linux-modules-extra-$(uname -r) (provides rdma_rxe)..."
          sudo apt-get update || echo "::warning::apt-get update failed"
          if ! sudo apt-get install -y "linux-modules-extra-$(uname -r)"; then
            echo "::warning::Failed to install linux-modules-extra-$(uname -r); rdma_rxe may be unavailable on this runner kernel"
          fi

          echo "Loading rdma_rxe module on host..."
          if sudo modprobe rdma_rxe; then
            echo "rdma_rxe module loaded successfully"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::modprobe rdma_rxe failed; skipping soft-RoCE e2e on this runner"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RDMA e2e tests (soft-RoCE)
        if: steps.rxe.outputs.available == 'true'
        run: make test-e2e
