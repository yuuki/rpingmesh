# golangci-lint v2 configuration (`make lint`; CI pins the same version in
# .github/workflows/test.yml). The generated protobuf bindings must exist
# first (`make generate-proto`), since the controller packages import them.
version: "2"

run:
  # Wait for another golangci-lint run (an editor integration, a second
  # checkout) instead of failing at once.
  allow-serial-runners: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, whose
        # std-error-handling preset already curates the cleanup calls
        # (Close of eBPF objects, links, fds) and hash.Hash.Write that never
        # fail; gosec reports them again without that curation.
        - G104
        # G115 (integer conversion overflow) floods on intentional
        # truncations: bit fields extracted from wire formats (probe packets,
        # BPF events, netlink attributes, mlx5 dumps), CLOCK_MONOTONIC
        # nanoseconds and config values whose ranges are validated at load.
        # Decoders of untrusted input are covered by fuzz targets instead.
        - G115
    staticcheck:
      checks:
        # The golangci-lint default set ...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ... without QF1008: the explicit embedded selectors
        # (m.lifecycle.start, mc.probeInstruments.x) name which embedded
        # helper a call goes to; dropping them is a quick-fix suggestion only.
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests run as an unprivileged developer with fixed inputs, and they
      # compare errors by identity on purpose (a function must return the
      # very error it was handed, unwrapped).
      - path: _test\.go
        linters: [gosec, errcheck, noctx, errorlint]

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
