# Configuration for cccc (https://github.com/moznion/cccc), which measures
# Cognitive and Cyclomatic Complexity. Read by `make complexity` and by
# .github/workflows/complexity.yml; the cccc README documents every key.

# Measure hand-written production code only: tests, generated code and vendored
# sources would skew the distribution.
exclude = [
  "*_test.go",          # Go tests
  "test_*.py",          # Python tests of scripts/topology/
  "e2e/**",             # end-to-end test suites
  "**/testdata/**",     # test fixtures
  "*_bpfel.go",         # bpf2go-generated bindings
  "**/bpf/include/**",  # vendored libbpf headers
  "legacy/**",          # archived first-generation module
  "*.bpf.c",            # BPF programs: the verifier constrains how they can be split
  "vendor/**",          # vendored Go modules (go mod vendor)
]

# Fail when a function's cognitive complexity exceeds this. The threshold is a
# ratchet toward 15, SonarSource's default: it is the highest score in the code
# today, so split a function that would exceed it rather than raising it, and
# lower it whenever refactoring brings the maximum down.
max-cognitive = 34
