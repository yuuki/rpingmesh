# R-Pingmesh Agent Configuration

# Agent identification
agent_id: ""        # Required: unique agent identifier (defaults to hostname)
hostname: ""        # Auto-detected if empty
# Optional: Top-of-Rack switch identifier. Empty = untagged virtual rack.
# "unspecified" is reserved (OTel/PathSummary label); the agent will not start
# if tor_id is set to that value.
tor_id: ""
# Optional: per-device ToR IDs for rail-optimized multi-rail hosts, where each
# RNIC is cabled to a different leaf switch. Unlisted devices use tor_id.
# See docs/design/multi-rail-tor-mapping.md (scripts/topology/ can generate it).
# device_tor_ids:
#   mlx5_0: "leaf-a"
#   mlx5_1: "leaf-b"

# Optional: network plane (rail) of the RNICs. On fabrics whose rails are not
# routed to each other, inter-ToR and untagged pinglists then only pair RNICs
# of the same plane (cross-plane probes can only time out). Empty = no
# restriction. Name the rail (the largest set of mutually reachable RNICs),
# not the leaf. Upgrade the controller first.
# plane_id: ""
# Per-device planes for multi-rail hosts (same rules as device_tor_ids; an
# entry wins over plane_id):
# device_plane_ids:
#   mlx5_0: "zone-a-rail0"
#   mlx5_1: "zone-a-rail1"

# Optional: derive each device's ToR from the LLDP neighbor of its netdev
# instead of listing device_tor_ids. Needs lldpd on the host and access to its
# socket (root or lldpd's group); the switch must send LLDP on host ports and
# the NIC firmware must pass LLDP frames to the host. Per device, a
# device_tor_ids entry wins over LLDP, and LLDP wins over tor_id. Discovery
# runs once at startup; restart the agent after re-cabling.
lldp_tor_discovery: false
# lldp_tor_id_field: system_name   # system_name (switch hostname) or chassis_id
# lldpcli_path: lldpcli
# lldp_discovery_timeout_sec: 60   # Startup wait for neighbors (0 = query once)

# Controller connection
controller_addr: "localhost:50051"

# Probing settings
# Minimum interval between two probes to the same target, i.e. a per-target
# ceiling of 1000 / probe_interval_ms probes/sec that applies on top of the caps
# below. At 500 ms ToR-mesh targets get min(2, 10) = 2 probes/s and inter-ToR
# targets min(2, 1) = 1 probe/s; set 100 to reach the full 10:1 ratio (5x the
# ToR-mesh probe traffic). The two types are paced independently.
probe_interval_ms: 500
# Per-target probe-rate caps (probes/sec PER TARGET; a target's ECMP flow labels
# share this budget, they do not multiply it). R-Pingmesh probes the ToR-mesh
# more aggressively than inter-ToR, so the two pinglist types have separate caps.
# target_probe_rate_per_second is the legacy uniform cap: it is used as the
# fallback for whichever per-type cap below is left at 0, so an existing config
# that only sets it keeps a single uniform rate.
target_probe_rate_per_second: 10   # Fallback cap for any per-type rate left at 0
tor_mesh_probe_rate_per_second: 10 # ToR-mesh targets (0 = inherit target_probe_rate_per_second)
inter_tor_probe_rate_per_second: 1 # Inter-ToR targets (0 = inherit target_probe_rate_per_second)
pinglist_update_interval_sec: 300 # Pinglist refresh interval

# ECMP flow-label rotation
# Period over which the rotating ~20% of each target's flow-label set is
# refreshed, shifting a fraction of probed ECMP paths over time while the rest
# stay stable for time-series continuity. The label COUNT is sized by the
# controller (see controller.yaml ecmp_* settings).
flow_label_rotation_period_sec: 3600

# Analyzer reporting (Phase 1)
# When enabled, the agent aggregates probe results per path over fixed windows
# and reports PathSummary batches to the controller's analyzer via
# ReportProbeAnalysis. Reporting is best-effort and never blocks probing.
analysis_report_enabled: true
analysis_window_sec: 30          # per-path aggregation window length

# RDMA settings
gid_index: 0                     # GID table index to use
# Queue selection for probes and ACKs, applied to every Address Handle. Set
# them to match the queue (PFC priority) of the workload you want to observe,
# and use identical values on every agent (ACKs use the responder's values).
# traffic_class is the GRH/IP traffic class octet: DSCP << 2 plus the 2 ECN
# bits (e.g. DSCP 26 -> 104, or 106 with ECT(0)); it selects the queue only
# with a RoCE v2 GID. service_level (0-7) matters only with trust pcp and
# VLAN-tagged RoCE. See README "Choosing traffic_class and service_level".
service_level: 0
traffic_class: 0
# Completion wait mode: "event" sleeps on a completion channel and an eventfd
# (no CPU while idle), "busy" polls the CQ every ~50us and the event ring
# every 100us (roughly 3% of a CPU per RDMA device), "auto" uses event with
# NIC hardware timestamps and busy with software timestamps (whose accuracy
# depends on prompt polling).
cq_poll_mode: "auto"
allowed_device_names: []         # Empty = all devices
# RDMA devices never to open (e.g. a storage-only or faulty RNIC). Applied on
# top of allowed_device_names; a name in both lists is a config error.
excluded_device_names: []        # Empty = exclude nothing
# Networks whose RDMA devices are never used, matched against each device's GID
# at gid_index (e.g. the management network). Unlike device names, this does
# not change when the kernel renames an RDMA device.
excluded_gid_cidrs: []           # e.g. ["10.0.0.0/24"]
# Use only the devices listed in device_tor_ids; others are skipped with a
# warning instead of falling back to tor_id. Requires device_tor_ids.
mapped_devices_only: false

# Telemetry
metrics_enabled: true
otel_collector_addr: "localhost:4317"
# Per-destination-RNIC metrics (rpingmesh.target_rnic.*, labelled with
# target_hostname, target_rdma_device, target_netdev): "off", "counters" (probe
# counters only), or "all" (also the RTT histograms). Their series grow with
# the targets per RNIC; see README. The default metrics are unaffected.
metrics_target_rnic_labels: "off"
# "stable" labels only targets with a stable set (sampled inter-ToR and capped
# untagged ToR-mesh targets get "_sampled"); "all" labels sampled ones too,
# whose set rotates on every pinglist refresh.
metrics_target_rnic_labels_scope: "stable"
# Max attribute sets per metric instrument (0 = OTel SDK default, 2000). It
# applies to every instrument, so a non-zero value must be at least 2000.
metrics_cardinality_limit: 0
# Attach target_tor to rpingmesh.prober_delay_ns. Off by default: the prober
# delay is time spent on the probing host, so target_tor only multiplies its
# series by the number of ToRs probed.
metrics_prober_delay_target_tor: false
# Attach target_tor to rpingmesh.responder_delay_ns. On by default: it is the
# only default metric that localizes slow responders (network RTT subtracts the
# responder delay). Turning it off saves series but loses that signal.
metrics_responder_delay_target_tor: true

# Self-protection (opt-in)
# When enabled, a watchdog samples this process's CPU/memory every
# watchdog_interval_sec and, on threshold breach, steps the probe send rate down
# (fail-slow: 1.0 -> 0.5 -> 0.25 -> 0.1, never 0) to shed load, restoring it as
# usage recovers. It never stops probing (no monitoring blind spot). The current
# multiplier is exported as the rpingmesh.agent.self_throttle gauge.
self_protection_enabled: false   # opt-in; default keeps prior behavior
watchdog_interval_sec: 5         # resource sampling period
# Hard runtime caps (applied whenever > 0, independent of self_protection_enabled):
max_memory_mb: 0                 # GOMEMLIMIT via debug.SetMemoryLimit (0 = disabled)
max_procs: 0                     # cap GOMAXPROCS (0 = Go default: all cores)
# Throttle thresholds (used only when self_protection_enabled):
throttle_memory_ratio: 0.9       # engage at 90% of max_memory_mb (only if max_memory_mb > 0)
throttle_cpu_percent: 90         # engage at 90% of available CPU capacity (GOMAXPROCS cores)

# Logging
log_level: "info"                # debug, info, warn, error
# Log output format on stderr: "console" (human-readable, default) or "json"
# (one zerolog JSON object per line; needed by scripts/topology/rtt_tor_check.py).
log_format: "console"
