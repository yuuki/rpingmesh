# R-Pingmesh Controller Configuration

# Server settings
listen_addr: ":50051"

# Database
database_uri: "http://localhost:4001"  # rqlite address
# Seconds to keep retrying the rqlite connection and schema setup at startup
# (exponential backoff from 1s up to 30s), so the controller tolerates an
# rqlite node that is still starting. 0 = single attempt.
database_connect_timeout_sec: 120

# ECMP path coverage (R-Pingmesh Eq.(1))
# The controller sizes each target's flow-label set so that its ECMP paths are
# covered with probability >= ecmp_coverage_probability, assuming
# ecmp_paths_assumed equal-cost paths, capped at ecmp_max_flow_labels.
ecmp_paths_assumed: 16            # Assumed ECMP fabric width (m)
ecmp_coverage_probability: 0.9    # Target coverage probability (p, in (0,1))
ecmp_max_flow_labels: 64          # Hard cap on labels per target (bounds amplification)

# Unset tor_id agents share one virtual rack. Their ToR-mesh pinglist is capped
# after same-host / same-family filters so a forgotten fleet-wide setting
# cannot become N^2 high-rate probes. 0 = unlimited (named ToR-mesh is never
# capped). The empty-ToR rqlite query itself is not paginated.
unspecified_mesh_max_targets: 32

# Analyzer (Phase 1)
# Ingests agent-reported per-path window summaries and flags SLO violations
# (per-path loss ratio and p99 network-RTT threshold breaches). Findings go to
# logs (with GID detail) and OTLP metrics (rpingmesh.analyzer.*, ToR-level
# attributes only). The cluster network (the controller's pinglists) and the
# service network (paths of traced application flows, see
# service_tracing_enabled in agent.yaml) are evaluated apart, each against
# its own thresholds; findings carry network="cluster" or "service".
analyzer_enabled: true
analyzer_sla_loss_ratio: 0.02            # cluster per-path loss ratio (0..1) that is a violation
analyzer_sla_network_rtt_p99_ns: 500000  # cluster per-path p99 network-RTT (ns) that is a violation (0 disables)
analyzer_service_slo_loss_ratio: 0.02            # service-network per-path loss ratio (0..1) that is a violation
analyzer_service_slo_network_rtt_p99_ns: 500000  # service-network per-path p99 network-RTT (ns) that is a violation (0 disables)
analyzer_window_retention: 20            # recent windows retained in memory
# Attribute sets per analyzer instrument before they fold into one overflow
# series: sla_violations_total needs up to 4 x T x (T-1) for T ToRs (network x
# ToR pair x kind), all at once in a wide outage. 20000 covers ~70 ToRs;
# 0 = OTel SDK default (2000), otherwise >= 2000.
analyzer_metrics_cardinality_limit: 20000
otel_collector_addr: "localhost:4317"    # OTLP endpoint for analyzer metrics

# Logging
log_level: "info"                       # debug, info, warn, error
log_format: "console"                   # console (human-readable) or json (one JSON object per line)
