receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Exporter type renamed from the deprecated `prometheusremotewrite` alias.
  prometheus_remote_write:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    # CRITICAL: keep metric names identical to the OTLP names (dots -> underscores
    # only). The instruments already carry _total / _ns, so DO NOT append suffixes.
    # `translation_strategy` replaces the deprecated `add_metric_suffixes: false`
    # (verified against exporter/prometheusremotewriteexporter/config.go at the
    # pinned 0.162.0 tag) -- never set both.
    translation_strategy: UnderscoreEscapingWithoutSuffixes

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus_remote_write]
