# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
#
# nfpm packaging definition for rpingmesh-controller (.deb/.rpm).
#
# Run from the repository root (contents `src` paths below are relative
# to the current working directory, not to this file):
#
#   make package-controller
#
# or directly:
#
#   nfpm package --config packaging/nfpm/nfpm-controller.yaml --packager deb --target dist/
#   nfpm package --config packaging/nfpm/nfpm-controller.yaml --packager rpm --target dist/
#
# Requires bin/rpingmesh-controller to already be built (`make
# build-controller`; pure Go, CGO_ENABLED=0, builds on any platform/arch --
# see README.md "Deployment").

name: "rpingmesh-controller"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "${NFPM_VERSION}"
section: "net"
priority: "optional"
maintainer: "R-Pingmesh maintainers"
description: |
  R-Pingmesh controller service.
  Manages agent registration and RNIC registry (backed by rqlite or
  PostgreSQL) and distributes ToR-mesh/inter-ToR pinglists to agents over
  gRPC. Pure Go, no RDMA dependency.
homepage: "https://github.com/yuuki/rpingmesh"
license: "Apache-2.0"

contents:
  - src: bin/rpingmesh-controller
    dst: /usr/bin/rpingmesh-controller
    file_info:
      mode: 0755

  - src: LICENSE
    dst: /usr/share/doc/rpingmesh-controller/LICENSE
    type: doc
    file_info:
      mode: 0644

  - src: NOTICE
    dst: /usr/share/doc/rpingmesh-controller/NOTICE
    type: doc
    file_info:
      mode: 0644

  - src: packaging/systemd/rpingmesh-controller.service
    dst: /usr/lib/systemd/system/rpingmesh-controller.service
    file_info:
      mode: 0644

  - dst: /etc/rpingmesh
    type: dir
    file_info:
      mode: 0755

  # Shipped as a sample, not the live config -- see the equivalent note in
  # nfpm-agent.yaml. controller.yaml's defaults assume a local rqlite at
  # http://localhost:4001, which won't be true in most deployments.
  - src: configs/controller.yaml
    dst: /etc/rpingmesh/controller.yaml.example
    file_info:
      mode: 0644

  # Passes the OTLP bearer token of the analyzer's metric export as a
  # systemd credential. Shipped as an example: it names a token file only the
  # operator can provide.
  - src: packaging/systemd/rpingmesh-controller.service.d/30-otel-collector-token.conf
    dst: /usr/share/doc/rpingmesh-controller/examples/rpingmesh-controller.service.d/30-otel-collector-token.conf
    type: doc
    file_info:
      mode: 0644

  # Passes a libpq password file for a PostgreSQL registry as a systemd
  # credential. Shipped as an example: it names a file only the operator can
  # provide.
  - src: packaging/systemd/rpingmesh-controller.service.d/40-postgresql-pgpass.conf
    dst: /usr/share/doc/rpingmesh-controller/examples/rpingmesh-controller.service.d/40-postgresql-pgpass.conf
    type: doc
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/nfpm/scripts/postinstall-controller.sh
  preremove: packaging/nfpm/scripts/preremove-controller.sh
