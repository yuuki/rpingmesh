# 10-service-tracing.conf - systemd drop-in granting rpingmesh-agent what
# service tracing (service_tracing_enabled: true) needs on top of the
# hardened base unit. Install it only together with that setting:
#
#   sudo install -D -m 0644 10-service-tracing.conf \
#       /etc/systemd/system/rpingmesh-agent.service.d/10-service-tracing.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rpingmesh-agent
#
# The agent loads eBPF programs and attaches kprobes to the uverbs entry
# points of the kernel (ib_uverbs_ioctl / ib_uverbs_write / ib_uverbs_close).
# On Linux 5.8+ that takes CAP_BPF (loading programs and maps) and
# CAP_PERFMON (perf_event_open for the kprobes); older kernels would need
# CAP_SYS_ADMIN, which this drop-in deliberately does not grant. The base
# unit's SystemCallFilter=@system-service does not include bpf(2) and
# perf_event_open(2) on every systemd version, so they are added explicitly.
# Lists in these three settings merge with the base unit's values.
#
# Without this drop-in the agent logs "permission denied loading eBPF
# programs" at startup and keeps probing without service tracing.
[Service]
CapabilityBoundingSet=CAP_BPF CAP_PERFMON
AmbientCapabilities=CAP_BPF CAP_PERFMON
SystemCallFilter=bpf perf_event_open
