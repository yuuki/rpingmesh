# Optional mlx5 startup QP recovery, in addition to 10-service-tracing.conf.
# Generic RDMA netlink enumeration needs no extra capability, but the
# RES_QP_GET_RAW API requires CAP_NET_ADMIN. Install this example under
# /etc/systemd/system/rpingmesh-agent.service.d/ only on hosts where
# driver-specific recovery of pre-existing connections is wanted.
# Reload the systemd configuration and restart the agent after installing.
# No configuration flag or extra system call is needed beyond enabling
# service tracing. Unsupported firmware/layouts remain unresolved.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_ADMIN
