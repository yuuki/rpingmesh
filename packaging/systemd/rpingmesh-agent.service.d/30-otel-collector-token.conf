# 30-otel-collector-token.conf - systemd drop-in that passes the bearer token
# of the OTLP metric export (otel_collector_bearer_token_file) to
# rpingmesh-agent as a systemd credential. Use it only together with
# otel_collector_tls_enabled: true; the agent refuses to start with a token
# but without TLS. See README.md "OTLP export security".
#
#   sudo install -m 0600 -o root -g root token /etc/rpingmesh/otel-collector-token
#   sudo install -D -m 0644 30-otel-collector-token.conf \
#       /etc/systemd/system/rpingmesh-agent.service.d/30-otel-collector-token.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rpingmesh-agent
#
# The token file holds only the token (a trailing newline is fine). systemd
# copies the root-only source into the service's private credentials
# directory, readable only by the service user, and %d expands to that
# directory, so the token never appears in a configuration file, an
# environment variable or the command line. Requires systemd 248 or later
# (LoadCredential= appeared in 247, the %d specifier in 248); on older
# systems set otel_collector_bearer_token_file to a file owned by the
# rpingmesh user with mode 0400 instead.
#
# The token is read once at startup: after replacing the source file,
# restart the service.
[Service]
LoadCredential=otel-collector-token:/etc/rpingmesh/otel-collector-token
Environment=RPINGMESH_OTEL_COLLECTOR_BEARER_TOKEN_FILE=%d/otel-collector-token
