# 40-postgresql-pgpass.conf - systemd drop-in that passes the password of a
# PostgreSQL registry database to rpingmesh-controller as a systemd
# credential, so it appears neither in controller.yaml nor in database_uri.
# See README.md "Using PostgreSQL".
#
#   sudo install -m 0600 -o root -g root pgpass /etc/rpingmesh/pgpass
#   sudo install -D -m 0644 40-postgresql-pgpass.conf \
#       /etc/systemd/system/rpingmesh-controller.service.d/40-postgresql-pgpass.conf
#   sudo systemctl daemon-reload && sudo systemctl restart rpingmesh-controller
#
# The file uses the libpq password file format, one line per server:
#
#   hostname:port:database:username:password
#
# for example "db.example:5432:rpingmesh:rpingmesh:<password>" for a
# database_uri of postgres://rpingmesh@db.example:5432/rpingmesh?sslmode=verify-full.
# Each of the first four fields may be *. The URI must not carry a password
# itself: the password file is only consulted when it does not.
#
# systemd copies the root-only source into the service's private credentials
# directory, readable only by the service user, and %d expands to that
# directory. Requires systemd 248 or later (LoadCredential= appeared in 247,
# the %d specifier in 248); on older systems point PGPASSFILE at a file owned
# by the rpingmesh user with mode 0400 instead.
#
# The file is read once at startup: after replacing the source file, restart
# the service.
[Service]
LoadCredential=pgpass:/etc/rpingmesh/pgpass
Environment=PGPASSFILE=%d/pgpass
