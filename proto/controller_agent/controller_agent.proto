syntax = "proto3";

package controller_agent;

option go_package = "github.com/yuuki/rpingmesh/proto/controller_agent";

// ControllerService provides agent registration, pinglist distribution and
// the target lookups service tracing needs.
service ControllerService {
    // RegisterAgent registers an agent and its RNICs with the controller.
    rpc RegisterAgent(AgentRegistrationRequest) returns (AgentRegistrationResponse);
    // GetPinglist returns the list of targets for an agent to probe.
    rpc GetPinglist(PinglistRequest) returns (PinglistResponse);
    // ReportProbeAnalysis reports per-path, window-aggregated probe summaries
    // from an agent so the controller-side analyzer can detect SLO violations
    // (and, in a future phase, localize switch/link faults across agents).
    rpc ReportProbeAnalysis(ProbeAnalysisReport) returns (ProbeAnalysisAck);
    // GetTargetRnicInfo resolves the remote RNICs of the service flows an
    // agent traced (paper section 4.2.2) into probe targets: the agent knows
    // only the destination GID of each flow and needs the responder QPN and
    // ToR the controller registered for that RNIC. Unknown GIDs (an RNIC
    // without a running agent) are left out of the response.
    rpc GetTargetRnicInfo(TargetRnicInfoRequest) returns (TargetRnicInfoResponse);
}

// RnicInfo describes an RDMA NIC.
message RnicInfo {
    string gid = 1;
    uint32 qpn = 2;
    string ip_address = 3;
    string host_name = 4;
    string tor_id = 5;
    string device_name = 6;
    // plane_id names the isolated network plane (rail) the RNIC is attached
    // to. On rail-optimized fabrics whose rails are not routed to each other,
    // the controller only pairs RNICs of the same plane in inter-ToR and
    // untagged (empty ToR) pinglists. Empty means unknown: the RNIC is then
    // paired as before plane support existed. Older agents never set it.
    string plane_id = 7;
    // netdev is the Linux network interface bound to the RNIC's probing
    // port/GID (e.g. "ens1f0"). It is metadata only: the controller stores it
    // and copies it into PingTarget.target_netdev so agents can label probe
    // metrics with the destination netdev when that option is enabled. Empty
    // when the agent could not resolve it, and from older agents.
    string netdev = 8;
}

// AgentRegistrationRequest is sent by agents to register with the controller.
message AgentRegistrationRequest {
    string agent_id = 1;
    string agent_ip = 2;
    string hostname = 3;
    string tor_id = 4;
    repeated RnicInfo rnics = 5;
}

// AgentRegistrationResponse is returned after agent registration.
message AgentRegistrationResponse {
    bool success = 1;
    string message = 2;
    // per_rnic_tor_id is true when the controller stored each RnicInfo.tor_id
    // as sent. Older controllers leave it false because they overwrite every
    // RNIC's tor_id with the request-wide one; an agent using per-device ToRs
    // must then fall back to the request-wide ToR, or its per-device pinglist
    // requests would never match the registry.
    bool per_rnic_tor_id = 3;
    // per_rnic_plane_id is true when the controller stored each
    // RnicInfo.plane_id and restricts pinglists to the requester's plane.
    // Older controllers leave it false and ignore plane_id, so their
    // pinglists may pair RNICs of different planes.
    bool per_rnic_plane_id = 4;
    // service_path_summaries is true when the controller's analyzer evaluates
    // PathSummary records of pinglist_type SERVICE_TRACING against the
    // service-network SLO thresholds, apart from the cluster ones. Older
    // controllers leave it false: they ignore PathSummary.pinglist_type and
    // would mix service paths into the cluster evaluation, so an agent must
    // keep service results out of its analysis reports.
    bool service_path_summaries = 5;
}

// PinglistType determines what kind of pinglist to generate, and which
// pinglist a PingTarget belongs to.
enum PinglistType {
    TOR_MESH = 0;     // All RNICs within the same ToR
    INTER_TOR = 1;    // Sample RNICs from other ToRs
    // SERVICE_TRACING targets are not generated by GetPinglist: the agent
    // builds them from the service flows it traces with eBPF, resolving the
    // remote RNICs through GetTargetRnicInfo. They are probed with the flow
    // label of the service flow so the probe takes the flow's ECMP path.
    SERVICE_TRACING = 2;
}

// PinglistRequest asks for a set of probe targets.
message PinglistRequest {
    string agent_id = 1;
    string tor_id = 2;
    string requester_gid = 3;
    PinglistType type = 4;
    // plane_id is the requesting RNIC's plane. The controller prefers the
    // plane registered for requester_gid and uses this value only when that
    // RNIC is not (yet) in the registry. Empty means no plane restriction.
    string plane_id = 5;
}

// PingTarget describes a single probe target.
message PingTarget {
    string target_gid = 1;
    uint32 target_qpn = 2;
    string target_ip = 3;
    string target_hostname = 4;
    string target_tor_id = 5;
    string target_device_name = 6;
    // source_port is deprecated: the controller still fills it, but no agent
    // reads it (the RoCEv2 UD source port is driver-generated and cannot be
    // set). Kept for wire compatibility.
    uint32 source_port = 7 [deprecated = true];
    // flow_label is the base (legacy) ECMP flow label applied via
    // ibv_ah_attr.grh.flow_label. It remains populated for backward
    // compatibility and is the sole label the agent uses when
    // flow_label_count <= 1.
    uint32 flow_label = 8;
    // priority is deprecated: the controller still fills it, but no agent
    // reads it (service level and traffic class are agent configuration).
    // Kept for wire compatibility.
    uint32 priority = 9 [deprecated = true];
    // flow_label_count is the number of distinct ECMP flow labels the agent
    // rotates through when probing this target. The controller sizes it via
    // R-Pingmesh Eq.(1) (coupon-collector coverage) so the target's ECMP paths
    // are covered with a configured probability. 0 or 1 selects legacy
    // single-label behavior (use flow_label as-is).
    uint32 flow_label_count = 10;
    // flow_label_seed deterministically seeds agent-side generation of the
    // flow-label set, so the controller need not enumerate every label in the
    // message (seed + count is far smaller than a repeated list). The agent
    // derives label i from a hash of (seed, i, rotation_epoch).
    fixed32 flow_label_seed = 11;
    // pinglist_type records which pinglist this target belongs to (ToR-mesh vs
    // inter-ToR). The controller stamps it in GenerateTorMeshPinglist /
    // GenerateInterTorPinglist -- the only place the classification is known --
    // so the agent can apply a differentiated, per-pinglist-type probe rate
    // (e.g. ToR-mesh at 10pps, inter-ToR at 1pps) without re-deriving the type
    // after the two lists are merged into a single target list. It defaults to
    // TOR_MESH (0), which is also the backward-compatible reading of targets
    // from an older controller that did not stamp the field.
    PinglistType pinglist_type = 12;
    // target_netdev is the target RNIC's netdev (RnicInfo.netdev), used only
    // as an optional destination metric label. Empty when unknown.
    string target_netdev = 13;
    // sampled marks a target the controller picked by random sampling that
    // changes across pinglist refreshes: every inter-ToR target, and the
    // targets of an untagged ToR-mesh that exceeded
    // unspecified_mesh_max_targets. Agents keep sampled targets out of the
    // optional destination-RNIC metric labels by default, because their
    // identities would otherwise accumulate as ever-new series.
    bool sampled = 14;
}

// PinglistResponse contains the list of targets to probe.
message PinglistResponse {
    repeated PingTarget targets = 1;
    PinglistType type = 2;
}

// TargetRnicInfoRequest asks for the registered RNICs behind the destination
// GIDs of the service flows one local RNIC traced.
message TargetRnicInfoRequest {
    string agent_id = 1;
    // requester_gid is the GID of the local RNIC the flows belong to. The
    // controller excludes the requester's own host, as GetPinglist does,
    // because a same-host probe never reaches the fabric.
    string requester_gid = 2;
    // target_gids are the destination GIDs to resolve, in the canonical
    // colon-separated hex form the registry stores. Duplicates are ignored.
    repeated string target_gids = 3;
}

// TargetRnicInfoResponse carries one PingTarget per resolved GID, with
// pinglist_type SERVICE_TRACING and no flow-label set: the agent stamps the
// service flow's own label. GIDs that are not registered, or that belong to
// the requester's host, are omitted.
message TargetRnicInfoResponse {
    repeated PingTarget targets = 1;
}

// PathSummary is a window-aggregated summary of one probe path
// (source RNIC -> target RNIC), produced by the agent-side PathAggregator.
// Reporting summaries instead of raw per-probe results cuts the controller's
// ingest volume by roughly three orders of magnitude (see analyzer design).
//
// RTT statistics are summary statistics only (min/max plus p50/p99 estimated
// from fixed histogram buckets); no full histogram is carried, to keep the
// message small. All RTT fields are network RTT in nanoseconds.
message PathSummary {
    string source_gid           = 1;   // source RNIC GID (this agent)
    string source_tor_id        = 2;   // source RNIC ToR (this agent)
    string target_gid           = 3;   // target RNIC GID
    string target_tor_id        = 4;   // target RNIC ToR
    uint32 target_qpn           = 5;
    uint64 window_start_unix_ns = 6;   // wall-clock start of the aggregation window
    uint32 window_duration_ms   = 7;
    uint32 probe_total          = 8;   // = probe_success + probe_failed + invalid_rtt_count
    uint32 probe_success        = 9;   // completed with a valid RTT (feeds the RTT stats)
    uint32 probe_failed         = 10;  // send failure or ACK timeout (counts as loss)
    uint64 network_rtt_min_ns   = 11;
    uint64 network_rtt_max_ns   = 12;
    uint64 network_rtt_p50_ns   = 13;
    uint64 network_rtt_p99_ns   = 14;
    // invalid_rtt_count: probes that completed all 6 timestamps (Success) but
    // whose RTT failed validation (e.g. clock-skew/SW-timestamp noise). Not
    // counted as loss.
    uint32 invalid_rtt_count    = 15;
    // pinglist_type is the pinglist the path's target came from. SERVICE_TRACING
    // summaries aggregate the probes sent along traced application flows (at
    // the service-tracing rate, with the flows' own flow labels); the analyzer
    // evaluates them against the service-network SLO thresholds, apart from
    // the cluster paths (TOR_MESH, INTER_TOR) of the same target RNIC.
    PinglistType pinglist_type  = 16;
}

// ProbeAnalysisReport is a batch of window summaries reported by one agent.
message ProbeAnalysisReport {
    string agent_id = 1;
    repeated PathSummary summaries = 2;
}

// ProbeAnalysisAck acknowledges a ProbeAnalysisReport.
message ProbeAnalysisAck {
    bool accepted = 1;
    // slo_violations is the number of summaries in the acked report that the
    // controller-side analyzer flagged as SLO violations (loss and/or p99 RTT
    // threshold breaches). It gives the reporting agent operational feedback
    // and makes the ingest+detection path observable end-to-end without an
    // OTLP collector. 0 when the analyzer is disabled.
    //
    // Renamed from sla_violations; the field number is unchanged, so the
    // wire format is the same and older agents and controllers interoperate.
    uint32 slo_violations = 2;
}
